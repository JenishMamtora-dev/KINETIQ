    <meta name="description" content="Curated freelance talent marketplace with verified escrow protection, transparent milestone deliverables, and world-class digital artisans." />
    <meta property="og:title" content="KINETIQ - Cinematic Editorial Marketplace" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
      /* Critical preloader overlay styles for first paint */
      #critical-intro-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #002111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #f1fcf4;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      @media (prefers-reduced-motion: reduce) {
        #critical-intro-overlay { display: none !important; }
      }
    </style>
    <noscript>
      <style>
        #critical-intro-overlay { display: none !important; }
      </style>
    </noscript>
  </head>
  <body class="bg-[#f1fcf4] text-[#141e19] antialiased selection:bg-[#96f3bf] selection:text-[#002111]">
    <!-- Inline critical overlay for first paint (removed on React mount) -->
    <div id="critical-intro-overlay" aria-hidden="true">
      <div style="width: 48px; height: 48px; border: 2px solid #62dd9e; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
    </div>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
